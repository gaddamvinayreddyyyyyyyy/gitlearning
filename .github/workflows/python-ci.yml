name: Python CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  run-python-script:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Python File
        run: python git_push.py